name: Keep Streamlit App Alive
on:
  schedule:
    - cron: '0 */6 * * *'  # Runs every 6 hours
  workflow_dispatch:      # Allows you to run it manually

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping App
        run: curl -s -o /dev/null -w "%{http_code}\n" https://skillmatch-ai-eqnhwpjpxjjwgjzxejhwhwe.streamlit.app/